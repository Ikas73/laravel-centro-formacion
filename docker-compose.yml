# docker-compose.yml MODIFICADO CON NGINX

services:
  db:
    image: postgres:14-alpine
    container_name: centro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-centro_formacion}
      POSTGRES_USER: ${DB_USERNAME:-usuario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "49000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-usuario} -d ${DB_DATABASE:-centro_formacion}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # El servicio 'app' ahora solo ejecuta PHP-FPM y no es accesible desde el exterior.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centro_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # SE ELIMINAN 'ports' y 'command'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env

  # NUEVO servicio 'nginx' que actúa como servidor web.
  nginx:
    image: nginx:stable-alpine
    container_name: centro_nginx
    restart: unless-stopped
    ports:
      - "8000:80" # El puerto 8000 de tu máquina ahora apunta a Nginx.
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # El túnel ahora apunta a Nginx.
  cloudflared-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - nginx # Ahora depende de nginx
    command: tunnel --url http://nginx:80 # Y apunta al servicio nginx

volumes:
  db_data: